name: Daily Paper Review

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 (UTC)
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .gemini/skills/auto-paper-reviewer/scripts/requirements.txt

      - name: Fetch and Review Paper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .gemini/skills/auto-paper-reviewer/scripts/fetch_and_review.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*.md
          git commit -m "docs: add daily paper review $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
